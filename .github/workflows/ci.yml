name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills, agent and manifest
        run: python3 scripts/validate.py

  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install APM
        run: pip install apm-cli

      - name: Pack
        run: apm pack --archive -o ./dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.zip
