name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills, agent and manifest
        run: python3 scripts/validate.py

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install APM
        run: pip install apm-cli

      - name: Smoke test, install the package into an empty project
        run: ./scripts/smoke-install.sh

      - name: Build package
        run: python3 scripts/build-package.py

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.zip
          if-no-files-found: error
