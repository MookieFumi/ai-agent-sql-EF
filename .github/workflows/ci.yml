name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills, agent and manifest
        run: python3 scripts/validate.py

  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install APM
        run: pip install apm-cli

      - name: Diagnose APM pack
        run: |
          apm --version
          apm pack --help
          apm pack --archive -o ./dist --verbose || true
          echo "--- git status"
          git status --short
          echo "--- tree"
          find . -path ./.git -prune -o -type f -newer apm.yml -print | head -50
          ls -la dist build 2>/dev/null || true

      - name: Pack
        run: apm pack --archive -o ./dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.zip
          if-no-files-found: error
